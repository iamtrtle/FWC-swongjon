<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise02 Bis: Calculator</title>
    <!-- Link CSS ตรงนี้ครับ -->
    <link rel="stylesheet" href="calc.css">
    <!-- Load jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <input type="text" id="leftMember" placeholder="Left number">
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
    </select>
    <input type="text" id="rightMember" placeholder="Right number">
    <input type="submit" id="submitBtn" value="Try me!">
    
    <script src="calc.js"></script>
</body>
</html>
