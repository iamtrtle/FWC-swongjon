<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise02: It's over 9000</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <div class="calculator-container">
        <!-- Left input field -->
        <input type="text" id="leftMember" placeholder="Left number">
        
        <!-- Operator selection -->
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
        
        <!-- Right input field -->
        <input type="text" id="rightMember" placeholder="Right number">
        
        <!-- Submit button -->
        <input type="submit" id="submitBtn" value="Try me!">
    </div>

    <script src="calc.js"></script>
</body>
</html>
