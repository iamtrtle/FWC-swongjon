<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%; 
        }
        
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        
        td {
            width: 50%;
            border: 1px solid black;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td style="background-color: #b5c777;">First cell</td>
            <td style="background-color: #f5bba3;">Second cell</td>
        </tr>
    </table>
</body>
</html>
