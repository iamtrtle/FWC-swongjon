<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
</head>
<body>
    <table style="width: 100%; border-collapse: collapse;">
        <tr>
            <td style="background-color: #b5c777; width: 50%; padding: 50px; border: 1px solid black;">First cell</td>
            <td style="background-color: #f5bba3; width: 50%; padding: 50px; border: 1px solid black;">Second cell</td>
        </tr>
    </table>
</body>
</html>
