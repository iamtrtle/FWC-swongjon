<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Effect</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- 1. First background image with message -->
    <div class="parallax bg-image-1">
        <div class="message">Welcome to Parallax</div>
    </div>

    <!-- 2. Black block in the middle -->
    <div class="black-block">
        <p>This is a dark section scrolling over the image.</p>
    </div>

    <!-- 3. Second background image with message -->
    <div class="parallax bg-image-2">
        <div class="message">The End of the Page</div>
    </div>

</body>
</html>
